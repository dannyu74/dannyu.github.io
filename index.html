<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danny U 時間表 - 2026秋季版</title>
    <style>
        body {
            background-color: #000000;
            background-image: 
                linear-gradient(135deg, rgba(255, 122, 0, 0.1) 25%, transparent 25%), 
                linear-gradient(225deg, rgba(255, 122, 0, 0.1) 25%, transparent 25%), 
                linear-gradient(45deg, rgba(255, 122, 0, 0.1) 25%, transparent 25%), 
                linear-gradient(315deg, rgba(255, 122, 0, 0.1) 25%, #000000 25%);
            background-position: 40px 0, 40px 0, 0 0, 0 0;
            background-size: 80px 80px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            color: #ffffff;
        }

        .wrapper {
            display: flex;
            flex-direction: row; 
            gap: 40px;
            max-width: 1200px;
            width: 100%;
            align-items: flex-start;
        }

        .main-content {
            flex: 2.3;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-tag {
            background: linear-gradient(135deg, #ff4500, #ff8c00);
            padding: 15px 45px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(255, 69, 0, 0.5);
            margin-bottom: 35px;
            transform: skewX(-4deg);
        }

        .main-title {
            margin: 0; 
            color: #ffffff;
            letter-spacing: 2px;
            font-weight: 900;
            font-size: 2.1rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .poster-container {
            background: #111111;
            padding: 20px;
            border: 2px solid #ff8c00;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(255, 140, 0, 0.3);
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .course-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        /* 圖片尚未上載時的提示文字樣式 */
        .img-placeholder {
            color: #ffaa00;
            font-size: 1.4rem;
            font-weight: bold;
            line-height: 1.8;
        }

        .download-btn {
            margin-top: 35px;
            background: #ffff00;
            color: #000000;
            padding: 16px 45px;
            border: none;
            border-radius: 30px;
            font-weight: 900;
            font-size: 1.2rem;
            letter-spacing: 1px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(255, 255, 0, 0.4);
        }

        .download-btn:hover {
            background: #ffffff;
            color: #000000;
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(255, 255, 255, 0.6);
        }

        .sidebar {
            flex: 1;
            margin-top: 90px;
            min-width: 300px;
        }

        .ancient-scroll-note {
            background: #161616;
            padding: 30px 25px;
            border: 2px solid #ff8c00;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

        .scroll-title {
            margin-top: 0; 
            color: #ffaa00;
            letter-spacing: 1.5px;
            font-size: 1.5rem;
            font-weight: 900;
            border-bottom: 2px dashed #444444;
            padding-bottom: 12px;
            text-align: center;
        }

        .scroll-text {
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: bold;
            line-height: 1.7;
            text-align: left;
            margin: 18px 0;
            padding-left: 24px;
            position: relative;
        }
        
        .scroll-text::before {
            content: "⚡";
            position: absolute;
            left: 0;
            color: #ffff00;
        }

        .whatsapp-btn {
            display: block;
            margin: 30px 0 15px 0;
            padding: 16px;
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            text-align: center;
            font-weight: 900;
            font-size: 1.15rem;
            letter-spacing: 1px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
        }

        .whatsapp-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
        }

        .update-date {
            margin-top: 25px;
            font-size: 0.95rem;
            color: #aaaaaa;
            border-top: 1px solid #333333;
            padding-top: 15px;
            text-align: center;
        }

        .update-date strong {
            color: #00ffff;
            font-size: 1.05rem;
        }

        @media (max-width: 950px) {
            body { padding: 20px; }
            .wrapper { flex-direction: column; align-items: center; gap: 30px; }
            .sidebar { margin-top: 10px; width: 100%; max-width: 450px; }
            .header-tag { padding: 12px 30px; }
            .main-title { font-size: 1.7rem; }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- 左邊主內容 -->
        <div class="main-content">
            <div class="header-tag">
                <h1 class="main-title">🍂 二零二六 秋季時間表</h1>
            </div>

            <div class="poster-container">
                <!-- 提示：請確定你的圖片檔名是 202610.jpg 並與 index.html 放同一夾 -->
                <img src="202610.jpg" alt="2026秋季課程表" class="course-img" onerror="this.style.display='none'; document.getElementById('error-msg').style.display='block';">
                
                <div id="error-msg" class="img-placeholder" style="display:none;">
                    ⚠️ 尚未上載時間表圖片 (202610.jpg)<br>
                    <span style="font-size: 1rem; color: #cccccc; font-weight: normal;">請將圖片檔案放入 GitHub 倉庫中。</span>
                </div>
            </div>

            <a href="202610.jpg" download class="download-btn">⚡ 下載秋季完整課程表 (JPG)</a>
        </div>

        <!-- 右邊側邊欄 -->
        <div class="sidebar">
            <div class="ancient-scroll-note">
                <h3 class="scroll-title">🌟 2026/27 秋季溫馨提示</h3>
                
                <div class="scroll-text">🍂 秋風起，三蛇肥，學電腦！</div>
                <div class="scroll-text">💪 保持身體健康，學ＡＩ最實際。</div>
                <div class="scroll-text">🤔 有咩疑問，What我吧！</div>
                
                <a href="https://wa.me/85291548979" class="whatsapp-btn" target="_blank">
                    💬 WhatsApp 聯繫
                </a>

                <div class="update-date">
                    📅 最後更新日期：<br>
                    <strong>2026-11-07</strong>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
